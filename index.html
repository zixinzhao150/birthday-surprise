
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Birthday Surprise!</title>

<style>
* { box-sizing: border-box; }

:root {
  --pink: #ffb6c9;
  --purple: #c9b6ff;
  --cream: #fff5df;
  --ink: #59485f;
}

body {
  margin: 0;
  font-family: "Trebuchet MS", sans-serif;
  color: var(--ink);
  background: #16172b;
  overflow-x: hidden;
}

button {
  font: inherit;
  cursor: pointer;
}

#room {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 10%, #fff0d2 0%, transparent 48%),
    linear-gradient(#f8dce8 0%, #fcebdc 68%, #d9b9aa 68%, #b88d82 100%);
  filter: brightness(.12);
  transition: filter 2s ease;
}

#room.lit { filter: brightness(1); }

.wall {
  position: absolute;
  inset: 0 0 32% 0;
  background-image:
    radial-gradient(#ffffff80 1.5px, transparent 1.5px);
  background-size: 38px 38px;
  opacity: .45;
  pointer-events: none;
}

.floor {
  position: absolute;
  bottom: 0;
  height: 32%;
  width: 100%;
  background: repeating-linear-gradient(
    90deg, #00000008 0 2px, transparent 2px 100px
  );
  pointer-events: none;
}

.window {
  position: absolute;
  top: 8%;
  left: 7%;
  width: 19%;
  height: 27%;
  border: 9px solid #fff5df;
  border-radius: 60px 60px 8px 8px;
  background: linear-gradient(#c2dafa, #fdf0db);
  box-shadow: inset 0 0 0 3px #dfb9b7;
}

.window::before,
.window::after {
  content: "";
  position: absolute;
  background: #fff5df;
}

.window::before {
  width: 7px;
  height: 100%;
  left: 50%;
}

.window::after {
  height: 7px;
  width: 100%;
  top: 50%;
}

#intro {
  position: fixed;
  z-index: 100;
  inset: 0;
  display: grid;
  place-items: center;
  background: #121326;
  color: white;
  text-align: center;
  padding: 24px;
  transition: opacity 1.5s ease, visibility 1.5s;
}

#intro.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#intro h1 {
  font-size: clamp(2rem, 7vw, 4rem);
  margin-bottom: 10px;
}

#intro p { color: #d7cfe9; }

.main-button,
.tool-button {
  border: 0;
  border-radius: 999px;
  padding: 13px 23px;
  background: #fff0f5;
  color: #754f72;
  box-shadow: 0 4px 0 #d6a4bb;
  transition: transform .2s, box-shadow .2s;
}

.main-button:hover,
.tool-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #d6a4bb;
}

#toolbar {
  position: relative;
  z-index: 20;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 20px 12px;
}

.tool-button { padding: 10px 16px; }

#decorPanel {
  display: none;
  position: relative;
  z-index: 20;
  margin: 0 auto;
  width: min(92%, 540px);
  padding: 15px;
  background: #fffaf0ef;
  border: 2px solid white;
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 8px 25px #6c435322;
}

#decorPanel.show { display: block; }

#choices {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.choice {
  font-size: 1.7rem;
  background: white;
  border: 2px solid #f2d5e1;
  border-radius: 14px;
  padding: 7px 12px;
}

.choice.selected {
  border-color: #b18ae7;
  background: #f1e8ff;
}

.zone {
  position: absolute;
  z-index: 5;
  border: 2px dashed #ffffff00;
  border-radius: 20px;
  transition: background .2s, border .2s;
}

.zone.ready {
  border-color: #fff;
  background: #ffffff28;
  cursor: pointer;
}

.zone.ready:hover { background: #ffffff60; }

#zoneLeft {
  left: 4%;
  top: 39%;
  width: 24%;
  height: 28%;
}

#zoneTop {
  left: 32%;
  top: 16%;
  width: 38%;
  height: 22%;
}

#zoneRight {
  right: 4%;
  top: 39%;
  width: 24%;
  height: 28%;
}

.placed {
  position: absolute;
  font-size: clamp(2rem, 5vw, 3.5rem);
  animation: pop .35s ease-out;
  pointer-events: none;
  filter: drop-shadow(0 3px 2px #60406025);
}

@keyframes pop {
  from { transform: scale(0); }
  to { transform: scale(1); }
}

#delivery {
  position: absolute;
  z-index: 30;
  left: -150px;
  bottom: 10%;
  font-size: clamp(4rem, 10vw, 6rem);
  background: transparent;
  border: 0;
  opacity: 0;
  transition: left 2s cubic-bezier(.2,.8,.2,1), opacity .5s;
  filter: drop-shadow(0 7px 4px #67454a35);
}

#delivery.arrived {
  left: calc(50% - 45px);
  opacity: 1;
}

#delivery.opened {
  transform: scale(.65);
  opacity: 0;
  pointer-events: none;
}

#birthdayScene {
  position: absolute;
  z-index: 10;
  left: 50%;
  top: 47%;
  transform: translate(-50%, -50%);
  width: min(90%, 580px);
  text-align: center;
  display: none;
}

#birthdayScene.show { display: block; }

#banner {
  font-size: clamp(1.8rem, 6vw, 3.6rem);
  color: #e65f92;
  text-shadow: 2px 3px white, 4px 5px #cda7e9;
  margin: 0 0 18px;
  animation: bannerIn 1s ease both;
}

@keyframes bannerIn {
  from {
    opacity: 0;
    transform: translateY(-35px) scale(.7);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

#cakeArea {
  position: relative;
  display: inline-block;
  margin: 0 auto;
}

#cake {
  font-size: clamp(6rem, 18vw, 10rem);
  line-height: 1.2;
  filter: drop-shadow(0 8px 4px #73465c30);
  transition: opacity .3s, transform .3s;
}

#cake.eaten {
  opacity: 0;
  transform: scale(.7) rotate(-12deg);
}

.cakePiece {
  position: absolute;
  font-size: 2.2rem;
  opacity: 0;
  pointer-events: none;
}

.cakePiece.gone {
  opacity: 1;
  animation: pieceGone .7s forwards;
}

@keyframes pieceGone {
  to {
    transform:
      translate(var(--dx), var(--dy))
      rotate(100deg) scale(.2);
    opacity: 0;
  }
}

#eatButton {
  display: none;
  margin-top: 14px;
}

#eatButton.show { display: inline-block; }

#balloons {
  position: fixed;
  z-index: 40;
  bottom: -120px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-evenly;
  pointer-events: none;
}

#balloons span {
  font-size: clamp(2rem, 5vw, 3.5rem);
  animation: floatUp 5s ease-in forwards;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) rotate(0);
    opacity: 0;
  }
  10% { opacity: 1; }
  85% { opacity: 1; }
  100% {
    transform: translateY(-120vh) rotate(25deg);
    opacity: 0;
  }
}

#letterArea {
  position: relative;
  z-index: 25;
  text-align: center;
  padding: 22px 12px 45px;
  margin-top: 56vh;
}

#envelope {
  font-size: 4.5rem;
  margin-bottom: 8px;
  filter: drop-shadow(0 4px 3px #60406030);
}

#letterButton { display: none; }

#letterButton.show { display: inline-block; }

#letterPaper {
  display: none;
  width: min(90%, 560px);
  margin: 18px auto;
  padding: 30px clamp(20px, 6vw, 45px);
  text-align: left;
  white-space: pre-wrap;
  line-height: 1.8;
  font-family: Georgia, serif;
  font-size: 1.05rem;
  color: #56465b;
  background: #fffdf5;
  border: 1px solid #f2dfbd;
  box-shadow: 0 10px 30px #62445b25;
  border-radius: 5px;
}

#letterPaper.show {
  display: block;
  animation: paperIn .8s ease both;
}

@keyframes paperIn {
  from {
    opacity: 0;
    transform: translateY(25px) rotate(2deg);
  }
  to {
    opacity: 1;
    transform: translateY(0) rotate(0);
  }
}

#letterText { min-height: 60px; }

#status {
  min-height: 1.5em;
  margin: 8px;
  font-size: .95rem;
}

@media (max-width: 600px) {
  #zoneLeft {
    left: 2%;
    width: 26%;
  }

  #zoneRight {
    right: 2%;
    width: 26%;
  }

  #zoneTop {
    left: 30%;
    width: 40%;
  }

  #letterArea { margin-top: 58vh; }
}
</style>
</head>

<body>

<div id="intro">
  <div>
    <div style="font-size:4rem">🌙</div>
    <h1>A little surprise...</h1>
    <p>Someone has a birthday to celebrate.</p>
    <button class="main-button" id="lightsButton">
      ✨ Turn on lights
    </button>
  </div>
</div>

<main id="room">
  <div class="wall"></div>
  <div class="floor"></div>
  <div class="window"></div>

  <header id="toolbar">
    <button class="tool-button" id="decorateButton">
      🎀 Decorate
    </button>
    <button class="tool-button" id="deliveryButton">
      📦 Get delivery
    </button>
  </header>

  <section id="decorPanel">
    <strong>Choose a decoration, then tap a glowing area!</strong>
    <div id="choices">
      <button class="choice" data-decor="🎈">🎈</button>
      <button class="choice" data-decor="⭐">⭐</button>
      <button class="choice" data-decor="🌸">🌸</button>
      <button class="choice" data-decor="🦋">🦋</button>
      <button class="choice" data-decor="🎀">🎀</button>
      <button class="choice" data-decor="💖">💖</button>
    </div>
    <p id="status">Pick your favorite decoration!</p>
  </section>

  <div class="zone" id="zoneLeft"></div>
  <div class="zone" id="zoneTop"></div>
  <div class="zone" id="zoneRight"></div>

  <button id="delivery" aria-label="Open birthday package">
    🎁
  </button>

  <section id="birthdayScene">
    <h1 id="banner">🎉 HAPPY BIRTHDAY! 🎉</h1>

    <div id="cakeArea">
      <div id="cake">🎂</div>

      <span class="cakePiece"
        style="top:10%;left:5%;--dx:-100px;--dy:-80px">
        🍰
      </span>

      <span class="cakePiece"
        style="top:30%;right:0;--dx:100px;--dy:-50px">
        🍰
      </span>

      <span class="cakePiece"
        style="bottom:0;left:10%;--dx:-70px;--dy:80px">
        🍰
      </span>

      <span class="cakePiece"
        style="bottom:5%;right:10%;--dx:90px;--dy:80px">
        🍰
      </span>
    </div>

    <div>
      <button class="main-button" id="eatButton">
        🍴 Eat the cake
      </button>
    </div>
  </section>

  <div id="balloons"></div>

  <section id="letterArea">
    <div id="envelope">💌</div>
    <p>A little letter, just for you...</p>

    <button class="main-button" id="letterButton">
      💌 Open letter
    </button>

    <article id="letterPaper">
      <div id="letterText"></div>
    </article>
  </section>
</main>

<script>
// EDIT YOUR BIRTHDAY MESSAGE HERE!
const birthdayMessage = `Dear friend,

Happy birthday!! 🎂💗

I hope your special day is filled with laughter,
little surprises, and all the things that make you happy.

Thank you for being such an amazing friend.
I'm so glad I got to know you, and I hope this next
year brings you lots of wonderful memories.

Never forget how special you are!

With lots of love,
Your friend 💌`;

const room = document.getElementById("room");
const intro = document.getElementById("intro");
const decorPanel = document.getElementById("decorPanel");
const status = document.getElementById("status");
const delivery = document.getElementById("delivery");
const birthdayScene = document.getElementById("birthdayScene");
const eatButton = document.getElementById("eatButton");
const letterButton = document.getElementById("letterButton");
const letterPaper = document.getElementById("letterPaper");
const letterText = document.getElementById("letterText");

let selectedDecor = "";
let delivered = false;
let cakeEaten = false;
let letterOpened = false;

// 1. Turn on the lights.
document.getElementById("lightsButton").addEventListener("click", () => {
  room.classList.add("lit");
  intro.classList.add("hidden");
});

// 2. Turn decoration mode on or off.
document.getElementById("decorateButton").addEventListener("click", () => {
  decorPanel.classList.toggle("show");

  const active = decorPanel.classList.contains("show");

  document.querySelectorAll(".zone").forEach(zone => {
    zone.classList.toggle("ready", active);
  });

  status.textContent = active
    ? "Choose a decoration, then tap a glowing area!"
    : "Decoration mode closed.";
});

// Select a decoration.
document.querySelectorAll(".choice").forEach(button => {
  button.addEventListener("click", () => {
    selectedDecor = button.dataset.decor;

    document.querySelectorAll(".choice").forEach(b => {
      b.classList.toggle("selected", b === button);
    });

    status.textContent = "Now tap an outlined area to place it!";
  });
});

// Place decorations in designated areas.
document.querySelectorAll(".zone").forEach(zone => {
  zone.addEventListener("click", () => {
    if (!selectedDecor) {
      status.textContent = "Pick a decoration first!";
      return;
    }

    const decoration = document.createElement("span");
    decoration.className = "placed";
    decoration.textContent = selectedDecor;

    const bounds = zone.getBoundingClientRect();
    const x = Math.random() * Math.max(0, bounds.width - 50);
    const y = Math.random() * Math.max(0, bounds.height - 50);

    decoration.style.left = x + "px";
    decoration.style.top = y + "px";

    zone.appendChild(decoration);
    status.textContent = "So cute! Choose another decoration or area.";
  });
});

// 3. Send the delivery package into the room.
document.getElementById("deliveryButton").addEventListener("click", () => {
  if (delivered) return;

  delivered = true;
  decorPanel.classList.remove("show");

  document.querySelectorAll(".zone").forEach(zone => {
    zone.classList.remove("ready");
  });

  delivery.classList.add("arrived");
  status.textContent = "Your surprise has arrived! Click the package!";
});

// 4. Open the package and reveal the cake.
delivery.addEventListener("click", () => {
  if (!delivered || birthdayScene.classList.contains("show")) return;

  delivery.classList.add("opened");
  birthdayScene.classList.add("show");
  eatButton.classList.add("show");

  launchBalloons();
  status.textContent = "Surprise!! Happy birthday! 🎉";
});

// Float balloons up the screen.
function launchBalloons() {
  const balloonBox = document.getElementById("balloons");
  balloonBox.innerHTML = "";

  const balloons = [
    "🎈", "🎈", "💗", "🎈",
    "🎈", "💜", "🎈", "🎈"
  ];

  balloons.forEach((balloon, index) => {
    const span = document.createElement("span");
    span.textContent = balloon;
    span.style.animationDelay = (index * 0.32) + "s";
    balloonBox.appendChild(span);
  });

  setTimeout(() => {
    balloonBox.innerHTML = "";
  }, 8000);
}

// 5. Eat the cake piece by piece.
eatButton.addEventListener("click", () => {
  if (cakeEaten) return;

  cakeEaten = true;
  eatButton.disabled = true;
  eatButton.textContent = "Yum! 😋";

  const pieces = [...document.querySelectorAll(".cakePiece")];

  pieces.forEach((piece, index) => {
    setTimeout(() => {
      piece.classList.add("gone");
    }, index * 650);
  });

  setTimeout(() => {
    document.getElementById("cake").classList.add("eaten");
  }, pieces.length * 650 + 400);

  setTimeout(() => {
    birthdayScene.style.display = "none";
    letterButton.classList.add("show");
    document.getElementById("envelope").textContent = "✉️";

    document.getElementById("letterArea").scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }, pieces.length * 650 + 1200);
});

// 6. Open the letter and type out your message.
letterButton.addEventListener("click", () => {
  if (letterOpened) return;

  letterOpened = true;
  letterButton.style.display = "none";
  letterPaper.classList.add("show");

  let i = 0;

  function typeNextCharacter() {
    if (i < birthdayMessage.length) {
      letterText.textContent += birthdayMessage.charAt(i);
      i++;
      setTimeout(typeNextCharacter, 32);
    }
  }

  typeNextCharacter();
});
</script>

</body>
</html>
